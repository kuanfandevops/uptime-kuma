apiVersion: template.openshift.io/v1
kind: Template
metadata:
  creationTimestamp: null
  name: uptime-kuma-bc
parameters:
  - name: VERSION
    displayName:
    description: image tag name for output
    required: true
  - name: GIT_REF
    displayName:
    description: zeva branch name of the pr
    required: true
objects:
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      annotations:
        description: Keeps track of changes in the client / backend image
      labels:
        shared: "true"
      creationTimestamp: null
      name: uptime-kuma
    spec:
      lookupPolicy:
        local: false
    status:
      dockerImageRepository: ""
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      annotations:
        description: Defines how to build the application
      creationTimestamp: null
      name: uptime-kuma-${VERSION}
      labels:
        shared: "true"
    spec:
      nodeSelector: null
      output:
        to:
          kind: ImageStreamTag
          name: uptime-kuma:${VERSION}
      resources:
        requests:
          cpu: 50m
          memory: 800Mi
      runPolicy: SerialLatestOnly
      source:
        git:
          ref: ${GIT_REF}
          uri: https://github.com/kuanfandevops/uptime-kuma.git
        type: Git
      strategy:
        dockerStrategy:
          dockerfilePath: docker/dockerfile
        type: Docker
      triggers: []
